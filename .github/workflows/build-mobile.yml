name: Build Android Mobile APK

on:
  push:
    paths:
      - 'skora-mobile/**'
      - '.github/workflows/build-mobile.yml'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NPM Dependencies
        working-directory: skora-mobile
        run: npm install --legacy-peer-deps

      - name: Prebuild Android Native
        working-directory: skora-mobile
        env:
          EXPO_PUBLIC_API_URL: "https://pms.skorainfotech.com"
        run: npx expo prebuild --platform android --clean

      - name: Assemble Release APK via Gradle
        working-directory: skora-mobile/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          EXPO_PUBLIC_API_URL: "https://pms.skorainfotech.com"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Locate and Rename APK
        run: |
          mkdir -p dist
          APK_PATH=$(find skora-mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find skora-mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist/skora-mobile-release.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skora-mobile-release-apk
          path: dist/skora-mobile-release.apk
          retention-days: 14

      - name: Upload APK to Open Mirrors
        id: upload-mirrors
        run: |
          echo "Uploading APK to open-source and direct mirrors..."
          APK_FILE="dist/skora-mobile-release.apk"
          
          # 1. GoFile
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name 2>/dev/null' || true)
          if [ -n "$SERVER" ] && [ "$SERVER" != "null" ]; then
            GOFILE_RESP=$(curl -s -F "file=@$APK_FILE" "https://${SERVER}.gofile.io/contents/uploadfile" || true)
            GOFILE_URL=$(echo "$GOFILE_RESP" | jq -r '.data.downloadPage 2>/dev/null' || true)
            echo "GOFILE_URL=$GOFILE_URL" >> $GITHUB_ENV
            echo "GoFile: $GOFILE_URL"
          fi

          # 2. tmpfiles.org
          TMP_RESP=$(curl -s -F "file=@$APK_FILE" https://tmpfiles.org/api/v1/upload || true)
          TMP_PAGE=$(echo "$TMP_RESP" | jq -r '.data.url 2>/dev/null' || true)
          if [ -n "$TMP_PAGE" ] && [ "$TMP_PAGE" != "null" ]; then
            TMP_URL=$(echo "$TMP_PAGE" | sed 's|tmpfiles.org/|tmpfiles.org/dl/|')
            echo "TMP_URL=$TMP_URL" >> $GITHUB_ENV
            echo "TmpFiles: $TMP_URL"
          fi

          # 3. transfer.sh
          TRANSFER_URL=$(curl -s --upload-file "$APK_FILE" https://transfer.sh/skora-mobile-release.apk || true)
          echo "TRANSFER_URL=$TRANSFER_URL" >> $GITHUB_ENV
          echo "Transfer.sh: $TRANSFER_URL"

          # 4. bashupload.com
          BASH_URL=$(curl -s https://bashupload.com/ -T "$APK_FILE" | grep "wget" | awk '{print $2}' || true)
          echo "BASH_URL=$BASH_URL" >> $GITHUB_ENV
          echo "BashUpload: $BASH_URL"

      - name: Job Summary with Direct Download Links
        run: |
          echo "## 📱 Android APK Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Direct Download Links (No Login Required):" >> $GITHUB_STEP_SUMMARY
          if [ -n "$GOFILE_URL" ] && [ "$GOFILE_URL" != "null" ]; then
            echo "- 🚀 **GoFile (High Speed):** $GOFILE_URL" >> $GITHUB_STEP_SUMMARY
            echo "::notice title=GoFile Download::$GOFILE_URL"
          fi
          if [ -n "$TMP_URL" ] && [ "$TMP_URL" != "null" ]; then
            echo "- 📦 **TmpFiles Direct Link:** $TMP_URL" >> $GITHUB_STEP_SUMMARY
            echo "::notice title=TmpFiles Download::$TMP_URL"
          fi
          if [ -n "$TRANSFER_URL" ] && [[ "$TRANSFER_URL" == https* ]]; then
            echo "- 🌐 **Transfer.sh Mirror:** $TRANSFER_URL" >> $GITHUB_STEP_SUMMARY
            echo "::notice title=Transfer.sh Mirror::$TRANSFER_URL"
          fi
          if [ -n "$BASH_URL" ] && [[ "$BASH_URL" == http* ]]; then
            echo "- 💾 **BashUpload Mirror:** $BASH_URL" >> $GITHUB_STEP_SUMMARY
            echo "::notice title=BashUpload Mirror::$BASH_URL"
          fi
