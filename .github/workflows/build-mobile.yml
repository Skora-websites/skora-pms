name: Build Android Mobile APK

on:
  push:
    paths:
      - 'skora-mobile/**'
      - '.github/workflows/build-mobile.yml'
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Distribute Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure CMake 3.22.1
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "cmake;3.22.1"

      - name: Install NPM Dependencies
        working_directory: skora-mobile
        run: npm install --legacy-peer-deps

      - name: Prebuild Android Native
        working_directory: skora-mobile
        env:
          EXPO_PUBLIC_API_URL: "https://pms.skorainfotech.com"
        run: npx expo prebuild --platform android --clean

      - name: Assemble Release APK via Gradle
        working_directory: skora-mobile/android
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          EXPO_PUBLIC_API_URL: "https://pms.skorainfotech.com"
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Locate and Rename APK
        run: |
          mkdir -p dist
          APK_PATH=$(find skora-mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find skora-mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist/skora-mobile-release.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skora-mobile-release-apk
          path: dist/skora-mobile-release.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: mobile-continuous-test
          name: Mobile Continuous Test Build (${{ github.sha }})
          body: |
            ### Automated Continuous Test Build
            - **Commit:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Triggered By:** `${{ github.actor }}`
            - **Direct Download:** [skora-mobile-release.apk](https://github.com/${{ github.repository }}/releases/download/mobile-continuous-test/skora-mobile-release.apk)
          files: dist/skora-mobile-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Open-Source Host (bashupload)
        id: bashupload
        run: |
          URL=$(curl -s https://bashupload.com/ -T dist/skora-mobile-release.apk | grep "wget" | awk '{print $2}')
          echo "DIRECT_URL=$URL" >> $GITHUB_ENV
          echo "Direct download URL: $URL"

      - name: Job Summary with Download Links
        run: |
          echo "## 📱 Android APK Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Links:" >> $GITHUB_STEP_SUMMARY
          echo "1. **Direct GitHub Release Link:** [Download skora-mobile-release.apk](https://github.com/${{ github.repository }}/releases/download/mobile-continuous-test/skora-mobile-release.apk)" >> $GITHUB_STEP_SUMMARY
          echo "2. **Nightly.link (No Login Needed):** [Download via nightly.link](https://nightly.link/${{ github.repository }}/workflows/build-mobile/main/skora-mobile-release-apk.zip)" >> $GITHUB_STEP_SUMMARY
          echo "3. **Direct Open-Source Mirror:** $DIRECT_URL" >> $GITHUB_STEP_SUMMARY
